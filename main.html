<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="wrapper d-flex flex-column w-100 min-vh-100 align-items-center justify-content-center"
    >
      <video
        id="myVideo"
        class="flex"
        width="765"
        height="430"
        src="https://www.w3schools.com/html/mov_bbb.mp4"
      ></video>
      <div
        class="d-flex w-100 min-vh-25 p-4 align-items-center justify-content-between"
      >
        <div
          class="d-flex flex-column justify-content-center align-items-center gap-0"
        >
          <progress id="progressTab" value="50" max="100"></progress>
          <h4>Progress</h4>
        </div>
        <button id="playPauseBtn" class="btn btn-dark">▶ Play</button>
        <div
          class="d-flex flex-column justify-content-center align-items-center gap-0"
        >
          <input type="range" id="volumeInput" min="0" max="100" value="0" />
          <h4>Volume</h4>
        </div>
        <div
          class="d-flex flex-column justify-content-center align-items-center gap-0"
        >
          <input
            type="range"
            id="playbackSpeed"
            min="0.5"
            max="2"
            step=".25"
            value="1"
          />
          <h4>Playback Speed</h4>
        </div>
        <button id="rewind" class="btn btn-dark"><<10s</button>
        <button id="forward" class="btn btn-dark">25s>></button>
      </div>
    </div>
  </body>
  <script src="./script.js"></script>
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"
  ></script>
</html>
